# Lighthouse dev infrastructure
# Postgres + Redis + Traefik. MinIO arrives in later phases.
#
# Bring up:    make up
# Tear down:   make down
# Wipe data:   make reset

name: lighthouse

services:
  postgres:
    image: postgres:16-alpine
    container_name: lighthouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-lighthouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lighthouse_dev_pw}
      POSTGRES_DB:       ${POSTGRES_DB:-lighthouse_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lighthouse} -d ${POSTGRES_DB:-lighthouse_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: lighthouse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # Traefik routes <deployment-id>.localhost to deployed containers via Docker labels.
  # Worker attaches new containers to the lighthouse-public network at run time;
  # Traefik watches that network and picks up routing labels automatically.
  traefik:
    image: traefik:v3.6
    container_name: lighthouse-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=lighthouse-public"
      - "--entrypoints.web.address=:80"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8090}:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - lighthouse-public

networks:
  # Worker creates this on first deploy via the Docker SDK. Marking external
  # so compose just attaches Traefik instead of trying to (re)create it.
  lighthouse-public:
    name: lighthouse-public
    external: true

volumes:
  postgres_data:
  redis_data:

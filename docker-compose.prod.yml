# Production stack. Bring up with `make prod-up`.

name: lighthouse-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: lighthouse-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-lighthouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB:       ${POSTGRES_DB:-lighthouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lighthouse} -d ${POSTGRES_DB:-lighthouse}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - lighthouse-internal

  redis:
    image: redis:7-alpine
    container_name: lighthouse-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - lighthouse-internal

  minio:
    image: minio/minio:latest
    container_name: lighthouse-prod-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-lighthouse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - lighthouse-internal

  # Unauthenticated over TCP, so it is never published to the host.
  buildkitd:
    image: moby/buildkit:latest
    container_name: lighthouse-prod-buildkit
    restart: unless-stopped
    privileged: true
    command: ["--addr", "tcp://0.0.0.0:1234"]
    volumes:
      - buildkit_data:/var/lib/buildkit
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - lighthouse-internal

  # One-shot. The runtime image carries no Prisma CLI, so replicas cannot race.
  api-migrate:
    build:
      context: ./lighthouse-api
      target: migrate
    container_name: lighthouse-prod-api-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lighthouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lighthouse}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - lighthouse-internal

  api:
    build:
      context: ./lighthouse-api
    container_name: lighthouse-prod-api
    restart: unless-stopped
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      postgres:    { condition: service_healthy }
      redis:       { condition: service_healthy }
      minio:       { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lighthouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lighthouse}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lighthouse}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-snapshots}
      WORKER_HTTP_URL: http://worker:8081
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD required}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      MODE: ${MODE:-server}
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN required}
      PUBLIC_API_URL: ${PUBLIC_URL}/api
      PUBLIC_APP_URL: ${PUBLIC_URL}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      ATLASSIAN_OAUTH_CLIENT_ID: ${ATLASSIAN_OAUTH_CLIENT_ID:-}
      ATLASSIAN_OAUTH_CLIENT_SECRET: ${ATLASSIAN_OAUTH_CLIENT_SECRET:-}
    labels:
      traefik.enable: "true"
      traefik.docker.network: lighthouse-public
      # Nest mounts its routes at the root, so the /api prefix has to come off.
      traefik.http.routers.lighthouse-api.rule: Host(`${LIGHTHOUSE_HOST}`) && PathPrefix(`/api`)
      traefik.http.routers.lighthouse-api.priority: "20"
      traefik.http.routers.lighthouse-api.middlewares: lighthouse-api-strip
      traefik.http.middlewares.lighthouse-api-strip.stripprefix.prefixes: /api
      # socket.io carries the log streams and the terminal, and keeps its path.
      traefik.http.routers.lighthouse-ws.rule: Host(`${LIGHTHOUSE_HOST}`) && PathPrefix(`/socket.io`)
      traefik.http.routers.lighthouse-ws.priority: "20"
      traefik.http.services.lighthouse-api.loadbalancer.server.port: "3000"
      traefik.http.routers.lighthouse-api.service: lighthouse-api
      traefik.http.routers.lighthouse-ws.service: lighthouse-api
    networks:
      - lighthouse-internal
      - lighthouse-public

  # No route of its own: the browser never talks to the worker.
  worker:
    build:
      context: ./lighthouse-worker
    container_name: lighthouse-prod-worker
    restart: unless-stopped
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      buildkitd: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lighthouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lighthouse}?sslmode=disable
      REDIS_URL: redis://redis:6379
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY required}
      BUILDKIT_HOST: tcp://buildkitd:1234
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8081"
      # Same path inside and out: the daemon resolves a user compose file's
      # relative bind mounts against the host, so a mismatch mounts empty dirs.
      WORK_DIR: ${LIGHTHOUSE_DATA_DIR:-/opt/lighthouse/data}/deployments
      MODE: ${MODE:-server}
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN required}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lighthouse}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-snapshots}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LIGHTHOUSE_DATA_DIR:-/opt/lighthouse/data}:${LIGHTHOUSE_DATA_DIR:-/opt/lighthouse/data}
    networks:
      - lighthouse-internal
      - lighthouse-public

  web:
    build:
      context: ./lighthouse-web
    container_name: lighthouse-prod-web
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: lighthouse-public
      # Catch-all, so it must lose to the routers above.
      traefik.http.routers.lighthouse-web.rule: Host(`${LIGHTHOUSE_HOST}`)
      traefik.http.routers.lighthouse-web.priority: "10"
      traefik.http.services.lighthouse-web.loadbalancer.server.port: "80"
    networks:
      - lighthouse-public

  traefik:
    image: traefik:v3.6
    container_name: lighthouse-prod-traefik
    profiles: ["local"]
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=lighthouse-public"
      - "--entrypoints.web.address=:80"
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - lighthouse-public

  # Cert resolver name `le` must match `certResolver` in worker stages/run.go.
  traefik-server:
    image: traefik:v3.6
    container_name: lighthouse-prod-traefik
    profiles: ["server"]
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=lighthouse-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=le"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL required for server mode}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - lighthouse-public

networks:
  # Worker creates this on its first deploy; `make prod-up` makes it earlier.
  lighthouse-public:
    name: lighthouse-public
    external: true
  lighthouse-internal:
    name: lighthouse-prod-internal

volumes:
  postgres_data:
  redis_data:
  minio_data:
  buildkit_data:
  letsencrypt:
